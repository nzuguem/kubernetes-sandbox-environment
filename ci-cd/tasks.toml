["ci-cd:gitlab-runner:register"]
description = "📝 Install and register a GitLab Runner (Helm)"
dir = "{{config_root}}/ci-cd"
usage = 'arg "<auth_token>" help="GitLab runner authentication token"'
run = '''
helm repo add gitlab https://charts.gitlab.io
helm repo update gitlab
helm upgrade --install gitlab-runner gitlab/gitlab-runner \
  --version 0.85.0 \
  --create-namespace --namespace gitlab-runner-system \
  --set runnerToken="${usage_auth_token}" \
  -f gitlab-runner/helm.values.yml
'''

["ci-cd:gitlab-runner:uninstall"]
description = "🧹 Uninstall GitLab Runner (Helm)"
run = "helm del gitlab-runner --namespace gitlab-runner-system"

["ci-cd:gitlab-runner-operator:install"]
description = "📦 Install GitLab Runner Operator"
dir = "{{config_root}}/ci-cd"
run = "kubectl apply -f gitlab-runner/operator.v1.45.0.yml"

["ci-cd:gitlab-runner-operator:register"]
description = "📝 Register a GitLab Runner via the Operator"
dir = "{{config_root}}/ci-cd"
usage = 'arg "<auth_token>" help="GitLab runner registration token"'
run = '''
kubectl create secret generic gitlab-runner-operator-secret \
  --namespace gitlab-runner-system \
  --from-literal=runner-registration-token="${usage_auth_token}" || true
kubectl apply -f gitlab-runner/runner.operator.yml
'''

["ci-cd:gitlab-runner-operator:uninstall"]
description = "🧹 Uninstall GitLab Runner Operator"
dir = "{{config_root}}/ci-cd"
run = "kubectl delete -f gitlab-runner/operator.v1.45.0.yml"
