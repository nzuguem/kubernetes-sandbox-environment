["datastores:postgres:install"]
description = "📦 Install PostgreSQL"
dir = "{{config_root}}/datastores"
run = '''
kubectl create namespace postgresql-system || true
kubectl apply -f postgresql/manifest.yml -n postgresql-system
'''

["datastores:redis:install"]
description = "📦 Install Redis"
dir = "{{config_root}}/datastores"
run = '''
kubectl create namespace redis-system || true
kubectl apply -f redis/manifest.yml -n redis-system
'''

["datastores:elasticsearch:install"]
description = "📦 Install Elasticsearch"
dir = "{{config_root}}/datastores"
run = '''
kubectl create namespace elasticsearch-system || true
kubectl apply -f elasticsearch/manifest.yml -n elasticsearch-system
'''

["datastores:strimzi:install"]
description = "📦 Install Strimzi Operator"
run = '''
helm repo add strimzi https://strimzi.io/charts/
helm repo update strimzi
# 0.51.0 for support of v1alpha1, v1beta1, and v1beta2
helm upgrade --install strimzi strimzi/strimzi-kafka-operator \
  --create-namespace \
  --namespace strimzi \
  --version 0.51.0
'''
