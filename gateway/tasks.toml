["gateway:gateway-api-crds:install"]
description = "📦 Install Gateway API experimental channel CRDs (TCPRoute, TLSRoute, UDPRoute, GRPCRoute, ...)"
hide = true
run = '''
kubectl apply --server-side -f https://github.com/kubernetes-sigs/gateway-api/releases/download/{{vars.gateway_api_version}}/experimental-install.yaml
# Just so that the TLS secret is generated
kubectl apply -f security/cert-manager/nginx.certificate.yml
'''

["gateway:gateway-api-crds:uninstall"]
description = "🧹 Uninstall Gateway API experimental channel CRDs"
hide = true
run = "kubectl delete -f https://github.com/kubernetes-sigs/gateway-api/releases/download/{{vars.gateway_api_version}}/experimental-install.yaml"

["gateway:inference-extension-crds:install"]
description = "📦 Install Gateway API Inference Extension CRDs"
hide = true
run = "kubectl apply -f https://github.com/kubernetes-sigs/gateway-api-inference-extension/releases/download/v0.3.0/manifests.yaml"

["gateway:nginx:install"]
description = "📦 Install Nginx Gateway Fabric, an implementation of the Kubernetes Gateway API"
dir = "{{config_root}}/gateway"
depends = ["gateway:gateway-api-crds:install"]
run = '''
helm upgrade --install nginx-gateway oci://ghcr.io/nginx/charts/nginx-gateway-fabric \
  --version 2.2.2 \
  --create-namespace \
  -n nginx-gateway-system \
  -f nginx/helm.values.yml
'''

["gateway:nginx:uninstall"]
description = "🧹 Uninstall Nginx Gateway Fabric"
run = [
  "helm del nginx-gateway -n nginx-gateway-system",
  { task = "gateway:gateway-api-crds:uninstall" },
]

["gateway:kgateway:install"]
description = "📦 Install KGateway, an implementation of the Kubernetes Gateway API"
dir = "{{config_root}}/gateway"
depends = ["gateway:gateway-api-crds:install", "gateway:inference-extension-crds:install"]
run = '''
helm upgrade -i --create-namespace --namespace kgateway-system --version v2.0.2 kgateway-crds oci://cr.kgateway.dev/kgateway-dev/charts/kgateway-crds
helm upgrade -i --namespace kgateway-system --version v2.0.2 kgateway oci://cr.kgateway.dev/kgateway-dev/charts/kgateway -f kgateway/helm.values.yml
'''

["gateway:kgateway:uninstall"]
description = "🧹 Uninstall KGateway"
run = '''
helm del kgateway -n kgateway-system
helm del kgateway-crds -n kgateway-system
'''
