apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: liquid
spec:
  parentRefs:
  - name: liquid
    kind: Service
    group: ""
    port: 80
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /coffee
    backendRefs:
    - name: coffee
      port: 80
  - matches:
      - path:
          type: Exact
          value: /tea
    backendRefs:
      - name: tea
        port: 80
