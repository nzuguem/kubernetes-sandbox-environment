["apim:microcks:install"]
description = "📦 Install Microcks"
dir = "{{config_root}}/apim"
run = '''
kubectl create ns microcks || true
kubectl create -f 'https://strimzi.io/install/latest?namespace=microcks' -n microcks || true
kubectl apply -f https://strimzi.io/examples/latest/kafka/kafka-ephemeral.yaml -n microcks
kubectl wait kafka/my-cluster --for=condition=Ready --timeout=300s -n microcks
helm repo add microcks https://microcks.io/helm
helm repo update microcks
helm upgrade --install microcks microcks/microcks \
  --namespace microcks \
  -f microcks/helm.values.yml \
  --version 1.14.0
'''

["apim:microcks:keycloak-credentials"]
description = "🔑 Get credentials of Microcks Keycloak"
run = '''echo "admin/$(kubectl -n microcks get secret microcks-keycloak-admin -o jsonpath='{.data.password}' | base64 -d)"'''

["apim:microcks:uninstall"]
description = "🧹 Uninstall Microcks"
run = "helm del -n microcks microcks"
