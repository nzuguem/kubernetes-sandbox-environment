# AWS credentials secret
apiVersion: v1
kind: Secret
metadata:
  name: floci-creds
  namespace: crossplane-system
type: Opaque
data:
  # This is just test/test.
  credentials: W2RlZmF1bHRdCmF3c19hY2Nlc3Nfa2V5X2lkID0gdGVzdAphd3Nfc2VjcmV0X2FjY2Vzc19rZXkgPSB0ZXN0Cg==

---

# AWS provider that references the secrete credentials
apiVersion: aws.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: floci
spec:
  s3_use_path_style: true
  skip_credentials_validation: true
  skip_metadata_api_check: true
  skip_requesting_account_id: true
  endpoint:
    services:
      - s3
      - s3control
    hostnameImmutable: true
    url:
      type: Static
      static: http://floci.default.svc.cluster.local:4566
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: floci-creds
      key: credentials
