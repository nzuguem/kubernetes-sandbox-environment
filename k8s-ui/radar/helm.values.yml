ingress:
  enabled: true
  className: nginx
  hosts:
    - host: radar.127.0.0.1.nip.io
      paths:
        - path: /
          pathType: Prefix
    # Set at install time to radar.<kind control plane IP>.nip.io (see k8s-ui:radar:install in k8s-ui/tasks.toml)
    - host: radar.CONTROL_PLANE_IP.nip.io
      paths:
        - path: /
          pathType: Prefix

rbac:
  secrets: true      # Keep disabled unless needed
  podExec: true       # Enable terminal feature
  podLogs: true       # Enable log viewer (default)
  portForward: true   # Enable port forwarding
