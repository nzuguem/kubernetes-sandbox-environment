# Devcontainer toolbox: the container's *global* mise config (MISE_GLOBAL_CONFIG_FILE, set in
# .devcontainer/devcontainer.json), so tools are available from any directory, not only in the repo.
# Tools not available with mise stay as devcontainer features in .github/.devcontainer.
# Add a tool from the devcontainer with `mise use -g <tool>@<version>`.

[plugins]
krew = "https://github.com/soupglasses/mise-krew" # krew plugins as mise tools (`krew:<plugin>`)

[tools]
# Kubernetes
kind = "0.33.0"
kubectl = "1.37.2"
kubecolor = "0.8.0"
helm = "4.3.1"
helmfile = "1.8.2"
kustomize = "5.8.3"
kubectx = "0.11.0"
kubens = "0.11.0"
k9s = "0.51.0"
stern = "1.35.0"
skaffold = "2.25.0"
vcluster = "0.37.6"
kubeseal = "0.41.2"
argocd = "3.6.1"
kyverno = "1.19.2"
pluto = "5.24.5"
popeye = "0.22.1"
oras = "1.3.6"
"aqua:kubernetes-sigs/krew" = "0.5.0" # Explicit backend: `krew` is the name of the mise-krew plugin
"krew:explore" = "latest"

# Cloud / platform CLIs
aws-cli = "2.39.5"
vault = "2.2.1"
temporal = "1.10.0"
"go:github.com/open-telemetry/opentelemetry-collector-contrib/cmd/telemetrygen" = "0.164.1"

# Languages / runtimes
go = "1.27.3"
node = "26.13.0" # Required by npm-backed tools (devcontainer-cli)
python = "3.15.2" # Required by pre-commit (a python3 zipapp)

# Dev tooling
gh = "2.103.3"
pre-commit = "4.7.0"
jq = "1.8.2"
yq = "4.54.2" # Required by the Helm post-renderer plugin workflows/temporal/postrender
fzf = "0.74.5"
neovim = "0.12.6"
tmux = "3.7c"
herdr = "0.9.5"
watchexec = "2.8.0"
fnox = { version = "1.47.0", workflow = "release.yml" }
pitchfork = { version = "2.33.1", workflow = "release.yml@refs/heads/main" }

# AI assistants
claude = "2.1.318"
copilot = "1.0.106"
antigravity-cli = "1.5.2" # Replaces gemini-cli

[settings]
experimental = true
