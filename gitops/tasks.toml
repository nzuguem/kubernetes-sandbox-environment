["gitops:argocd:install"]
description = "📦 Install ArgoCD"
dir = "{{config_root}}/gitops"
run = [
  '''
  helm repo add argocd https://argoproj.github.io/argo-helm
  helm repo update argocd
  helm upgrade --install argocd argocd/argo-cd --version 9.4.1 \
    --create-namespace --namespace argocd-system -f argocd/helm.values.yml
  # Wait for ArgoCD to be ready.
  kubectl wait -n argocd-system --for=condition=ready pod \
    --selector=app.kubernetes.io/name=argocd-repo-server --timeout=90s
  ''',
  { task = "gitops:argocd:credentials" },
]

["gitops:argocd:uninstall"]
description = "🧹 Uninstall ArgoCD"
run = "helm del argocd -n argocd-system"

["gitops:argocd:credentials"]
description = "🔑 Get credentials of ArgoCD"
run = '''echo "admin/$(kubectl -n argocd-system get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d)"'''
