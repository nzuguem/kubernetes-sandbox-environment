["ai:agentgateway:install"]
description = "📦 Install agentgateway"
dir = "{{config_root}}/ai"
run = '''
# Install CRDs
helm upgrade --install \
  --create-namespace --namespace agentgateway-system \
  --version v1.4.0 agentgateway-crds \
  oci://cr.agentgateway.dev/charts/agentgateway-crds
# Install Control Plane and GatewayClass
helm upgrade --install \
  -n agentgateway-system \
  agentgateway oci://cr.agentgateway.dev/charts/agentgateway \
  --version v1.4.0 \
  --reuse-values \
  --set agentgatewayModels.enabled=true \
  --wait
kubectl apply -f agentgateway/agentgateway-proxy.yml -n agentgateway-system
'''

["ai:litellm:install"]
description = "📦 Install LiteLLM"
dir = "{{config_root}}/ai"
depends = ["datastores:postgres:install", "datastores:redis:install"]
run = '''
kubectl create namespace litellm-system || true
kubectl create secret generic litellm-masterkey \
  --from-literal=masterkey="sk-$(openssl rand -hex 24)" \
  -n litellm-system || true
kubectl create secret generic litellm-db \
  --from-literal=username=postgres \
  --from-literal=password=postgres \
  -n litellm-system || true
kubectl create secret generic litellm-env \
  --from-literal=LITELLM_SALT_KEY="sk-$(openssl rand -hex 24)" \
  --from-literal=REDIS_PASSWORD=redis \
  -n litellm-system || true
helm upgrade --install litellm \
  oci://ghcr.io/berriai/litellm/chart/litellm \
  --version 1.95.1 \
  --namespace litellm-system \
  -f litellm/helm.values.yml
'''

["ai:litellm:credentials"]
description = "🔑 Get credentials of LiteLLM"
run = '''echo "admin/$(kubectl -n litellm-system get secret litellm-masterkey -o jsonpath='{.data.masterkey}' | base64 -d)"'''

["ai:mcp-inspector:start"]
description = "🚀 Launch @modelcontextprotocol/inspector"
dir = "{{config_root}}/ai"
env = { MCP_CATALOG_PATH = "agentgateway/mcp/mcp.json" }
run = "mise x node -- npx -y @modelcontextprotocol/inspector --tui"
